name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # S-70: unit tests on both platforms (the code runs on Windows dev machines and Linux servers).
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm
      - run: npm ci
      - name: Unit and API tests
        run: npx vitest run

  # S-248/S-249: the data layer and migration runner against a real MySQL 8.4 (SQLite alone would hide MySQL-only behaviour).
  mysql:
    name: data layer on MySQL 8.4
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: pp_root
        ports: ['3307:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppp_root"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      MYSQL_TEST_URL: mysql://root:pp_root@127.0.0.1:3307
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm
      - run: npm ci
      - name: Data layer contract on MySQL
        run: npx vitest run tests/backend --no-file-parallelism

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm
      - run: npm ci
      - name: Secret scan (local fallback)
        run: npm run scan:secrets
      - name: Dependency audit (report only)
        run: npm audit --audit-level=high
        continue-on-error: true # TODO: make blocking once the current high/critical findings are fixed
      - name: Banned-wording copy lint
        run: npm run lint:copy
      - name: Typecheck
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint:eslint
      - name: Docs check (.env.example covers every env var the code reads)
        run: npm run check:docs
      - name: Unit and API tests with coverage (thresholds: server/civic, src/lib)
        run: npx vitest run --coverage --reporter=default --reporter=json --outputFile.json=vitest.json
      - name: Data validation
        run: npm run pipeline:validate
      - name: Production build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E (includes the production-build smoke test, e2e/ops.spec.ts)
        run: npx playwright test --reporter=list,html,json
      - name: Offline shell and 2G e2e against the production build
        run: E2E_BUILT=1 npx playwright test e2e/lite.spec.ts --project=chromium -g "offline|first usable"
        env:
          CI: 'true'
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright.json
      - name: Story tracker gate (tagged tests exist, ran, passed, not skipped; STORY_TRACKER.md current)
        run: npm run tracker -- --check --report vitest.json --report playwright.json
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            playwright-report/
            test-results/
            coverage/
            vitest.json
            playwright.json
          retention-days: 14
